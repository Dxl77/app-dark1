<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Automático de Vídeo Dark</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Gerador Automático de Vídeo Dark</h1>
        <p>Gere o vídeo final completo sem precisar do terminal!</p>

        <div class="form-group">
            <label>1. Áudio da Narração (.mp3):</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div class="form-group">
            <label>2. Imagens de Apoio (Selecione todas as 12 imagens):</label>
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>

        <button id="generateBtn" onclick="gerarVideo()">🚀 Gerar e Baixar Vídeo (.mp4)</button>

        <div id="status" class="status-box">Aguardando arquivos...</div>

        <!-- Canvas invisível onde o vídeo é montado em tempo real -->
        <canvas id="videoCanvas" width="1280" height="720" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
